<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FE 1주차 과제</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="login-card">
      <div class="left-section">
        <div class="row-box profile-header">
          <img src="YU_LikeLion.png" style="width: 80px" alt="영대멋사로고" />
          <h2>영남대학교<br/>멋쟁이사자처럼<br/>14기</h2>
        </div>

        <div class="row-box description">
          <p>여러분을 진심으로 환영합니다!</p>
          <br>
          <p>
            멋쟁이사자처럼은 성장 의지를 가진 사람들을 돕기 위해 존재합니다.<br>
            그리고 이들을 돕기 위한 가장 근본적이고 효과적인 방법은 교육이라고
            생각합니다!
          </p>
        </div>

        <div class="row-box footer-boxes">
          <div class="small-box"><h2>P&D</h2></div>
          <div class="small-box"><h2>FE</h2></div>
          <div class="small-box"><h2>BE</h2></div>
        </div>
      </div>
      <div class="right-section">
        <div class="login-container">
          <h2>LOGIN</h2>
          <form>
            <input type="text" placeholder="👤  username" class="login-input" />
            <input type="password" placeholder="🔒  password" class="login-input" />
            <button type="submit" class="login-btn">로그인</button>
          </form>
          <!-- 아이콘 변경 수정하기 -->
        </div>
      </div>
    </div>
  </body>
</html>
